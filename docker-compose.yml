services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paypilot
      POSTGRES_USER: paypilot
      POSTGRES_PASSWORD: paypilot
    ports:
      - "5432:5432"
    volumes:
      - paypilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypilot -d paypilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://paypilot:paypilot@db:5432/paypilot
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  paypilot_pgdata:
